<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wax 가상 사무실</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>wax 가상 사무실</h1>
    <span class="status" id="status" data-state="down">연결 중…</span>
    <span class="spacer"></span>
    <nav><a href="/">채널</a><a href="/start">요청과 보고</a><a href="/search">검색</a><a href="/office" aria-current="page">가상 사무실</a><a href="/help">도움말</a></nav>
  </header>
  <main class="office-main">
    <div class="office-toolbar">
      <button type="button" id="view-toggle" aria-pressed="false">목록 보기</button>
      <button type="button" id="open-board">화이트보드 열기</button>
      <button type="button" id="open-skills" aria-haspopup="dialog" aria-controls="skill-dialog">스킬 지도</button>
      <button type="button" id="open-studio" aria-haspopup="dialog" aria-controls="studio-dialog">디자인실 제작물</button>
      <button type="button" id="open-messenger" aria-haspopup="dialog" aria-controls="messenger-dialog" aria-expanded="false">팀 메시지 <span class="message-count" id="message-count" hidden></span></button>
      <button type="button" id="chatter-toggle" aria-pressed="true" title="안내 NPC(제이크·써니·에밀리·리나·테스·브라이언·제니)와 캐릭터의 가벼운 잡담. 화면에만 보이고 기록되지 않습니다">NPC·잡담 켜짐</button>
      <div class="legend" aria-label="노트 색상">
        <span><i class="legend-opinion"></i>의견</span>
        <span><i class="legend-question"></i>질문</span>
        <span><i class="legend-answer"></i>답변</span>
        <span><i class="legend-decision"></i>결정</span>
      </div>
      <span class="spacer"></span>
    </div>
    <div class="room-tabs" id="room-tabs" role="tablist" aria-label="방 선택"></div>
    <p class="notice" id="notice" hidden></p>
    <section id="office-view" aria-label="사무실 보기">
      <div class="stage" id="stage">
        <canvas id="canvas" width="1424" height="848" role="img" aria-label="가상 사무실 불러오는 중"></canvas>
        <div class="overlay" id="overlay"></div>
      </div>
    </section>
    <section id="list-view" aria-label="목록 보기" hidden>
      <div class="table-wrap">
        <table class="agent-table">
          <thead><tr><th>이름</th><th>종류</th><th>상태</th><th>방</th><th>작업</th><th>마지막 활동</th><th>최근 메시지</th></tr></thead>
          <tbody id="agent-rows"></tbody>
        </table>
      </div>
    </section>
    <p class="visually-hidden" aria-live="polite" id="live"></p>
  </main>

  <dialog id="agent-dialog" aria-labelledby="agent-title">
    <header><h2 id="agent-title"></h2><button type="button" data-close>닫기</button></header>
    <div class="content" id="agent-content"></div>
  </dialog>
  <dialog id="studio-dialog" aria-labelledby="studio-title">
    <header><h2 id="studio-title">B1 디자인실 · 제작물과 인계</h2><button type="button" data-close>닫기</button></header>
    <div class="content" id="studio-content"></div>
  </dialog>

  <dialog id="skill-dialog" aria-labelledby="skill-title">
    <header><h2 id="skill-title">스킬 지도 · 누가 어떤 일을 해 봤나</h2><button type="button" data-close>닫기</button></header>
    <div class="content" id="skill-content"></div>
  </dialog>

  <dialog id="board-dialog" aria-labelledby="board-title">
    <header>
      <h2 id="board-title">화이트보드</h2>
      <label class="visually-hidden" for="board-select">보드 선택</label>
      <select id="board-select"></select>
      <button type="button" data-close>닫기</button>
    </header>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-notes" aria-controls="panel-board" aria-selected="true" data-tab="notes">노트</button>
      <button type="button" role="tab" id="tab-phases" aria-controls="panel-board" aria-selected="false" data-tab="phases">작업 단계</button>
      <button type="button" role="tab" id="tab-reports" aria-controls="panel-board" aria-selected="false" data-tab="reports">보고서</button>
    </div>
    <div class="content" id="panel-board" role="tabpanel"></div>
  </dialog>

  <dialog id="messenger-dialog" class="office-messenger" aria-labelledby="messenger-title">
    <header>
      <div><h2 id="messenger-title">팀 메시지</h2><p data-messenger-target></p></div>
      <button type="button" data-close aria-label="팀 메시지 닫기">닫기</button>
    </header>
    <div class="messenger-preview" data-messenger-preview hidden></div>
    <iframe id="messenger-frame" title="팀 채널 대화와 답장"></iframe>
  </dialog>

  <script type="module" src="/locale.mjs"></script>
  <script type="module" src="/office/office.mjs"></script>
</body>
</html>
