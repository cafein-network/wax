# Included in release archives; runs only in the public repository.
name: Public checks and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    if: github.repository == 'cafein-network/wax'
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings (generated commands and faces.json are checked as text)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - name: Tests (60 s per test, from package.json)
        if: runner.os == 'Windows'
        run: npm test
      - name: Tests (60 s per test; a run that does not exit lists the lingering test processes)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          npm test & pid=$!
          for _ in $(seq 1 600); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::npm test did not exit within 10 minutes; lingering processes:"
            ps -eo pid,etime,args | grep -E "node|\.test\.mjs" | grep -v grep
            kill -TERM "$pid"; exit 1
          fi
          wait "$pid"
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release archive extracts and runs without install
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: python3 test/package_test.py
      - name: Codex discovers and installs the packaged marketplace without AI calls
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          npm install --global @openai/codex@0.163.0
          python3 scripts/package-release.py --out-dir "$RUNNER_TEMP/wax-package"
          python3 -m zipfile -e "$RUNNER_TEMP/wax-package/wax-latest.zip" "$RUNNER_TEMP/wax-unpacked"
          node scripts/verify-codex-marketplace.mjs "$(command -v codex)" "$RUNNER_TEMP/wax-unpacked/wax"

  release:
    # A main-branch release needs an explicit marker; ordinary pushes only run checks.
    if: github.repository == 'cafein-network/wax' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]')))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify or create the requested release tag
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$tag" = "$GITHUB_REF_NAME"
          else
            if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
              test "$existing" = "$GITHUB_SHA"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build release archive
        run: python3 scripts/package-release.py --out-dir dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/wax-*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          files=("dist/wax-$version.zip" dist/wax-latest.zip dist/SHA256SUMS.txt dist/latest.json)
          printf '<!-- wax:changes:start -->\n' > dist/github-release-notes.md
          cat dist/RELEASE_NOTES.md >> dist/github-release-notes.md
          printf '<!-- wax:changes:end -->\n\nChanges: https://wax.me2shop.com/#changelog · Installation: INSTALL.md\nVerify provenance: gh attestation verify wax-%s.zip --repo %s\n' "$version" "$GITHUB_REPOSITORY" >> dist/github-release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --title "wax $version" --notes-file dist/github-release-notes.md
          fi
